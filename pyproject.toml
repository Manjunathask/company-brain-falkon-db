[project]
name = "busfactor"
version = "0.1.0"
description = "Bus Factor: a company brain for Delta Lake, on FalkorDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.8.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busfactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
