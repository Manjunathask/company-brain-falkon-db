<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t d">
  <title id="t">Why the handover packet suggests scottsand-db for flink/inttest</title>
  <desc id="d">Hao Jiang (harperjiang) made 3 recent commits in flink/inttest, where no other recent author has 2 or more.
  Those commits belong to three pull requests: 6188 (7 files in the area), 6192 (3 files) and 6933 (1 file). Pull
  request 6188 was reviewed by huan233usc, tdas and scottsand-db; 6192 by scottsand-db; 6933 by kaiqijinwow and
  timothyw553. Pull request 6188's title matches the Catalog-Managed Tables decision, a low-confidence link.
  scottsand-db and tdas took part in that decision through explicit links. The suggested successor is scottsand-db,
  who reviewed 2 of the 3 pull requests, has no commits there yet, and took part in Catalog-Managed Tables. Candidates
  are ordered by a plain sort, not a weighted score.</desc>
